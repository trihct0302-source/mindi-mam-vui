><svg viewBox="0 0 32 32"><use href="icons/sprite.svg#heart"/></svg><svg viewBox="0 0 32 32"><use href="icons/sprite.svg#gift"/></svg><svg viewBox="0 0 32 32"><use href="icons/sprite.svg#star"/></svg><svg viewBox="0 0 32 32"><use href="icons/sprite.svg#trophy"/></svg><svg viewBox="0 0 32 32"><use href="icons/sprite.svg#shirt"/></svg><svg viewBox="0 0 32 32"><use href="icons/sprite.svg#book"/></svg><svg viewBox="0 0 32 32"><use href="icons/sprite.svg#calendar"/></svg><svg viewBox="0 0 32 32"><use href="icons/sprite.svg#coin"/></svg><svg viewBox="0 0 32 32"><use href="icons/sprite.svg#diamond"/></svg></div></section><section class="card"><h3>Progress</h3><div style="height:18px;background:url(progress/track.svg) center/100% 100%"><div style="height:18px;width:58%;background:url(progress/fill.svg) left/200px 18px"></div></div><p>4/7 ngày chăm Mầm</p><img width="52" height="30" src="controls/toggle-on.svg"><img width="28" height="28" src="controls/checkbox-checked.svg"></section></div></main></html>
