<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thư viện hình ảnh · MINDI</title>
  <link rel="stylesheet" href="../assets/ui-v1/sprite-art.css">
  <style>
    :root{font:16px system-ui;color:#453451;background:#f5eef8}
    body{max-width:1200px;margin:auto;padding:24px}
    a{color:#553c7e}
    header,.filters,figure{background:#fff9ff;border:1px solid #cbb5e2;border-radius:18px;padding:16px}
    header h1{margin:8px 0}
    nav,.filters{display:flex;gap:16px;flex-wrap:wrap}
    .filters{margin-block:16px}
    label{display:grid;gap:4px;font-weight:650}
    select{font:inherit;min-height:44px;border:1px solid #8064a8;border-radius:10px;padding:6px;background:white;color:inherit}
    #forms,#props{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(138px,100%),1fr));gap:10px}
    figure{margin:0;text-align:center}
    .sprite{position:relative;aspect-ratio:1;display:grid;place-items:center;background:#eee4f5;border-radius:12px}
    img{display:block;max-width:100%;width:100%;height:100%;object-fit:contain}
    img.accessory{position:absolute;left:var(--accessory-x);top:var(--accessory-y);width:var(--accessory-size);height:var(--accessory-size);translate:-50% -50%}
    img.item{width:64px;height:64px;margin:auto}
    figcaption{font-size:.875rem;margin-top:8px}
    section{margin-block:24px}
  </style>
</head>
<body>
  <header>
    <nav><a href="../">Chơi Mầm Vui</a><a href="dashboard.html">Kết quả QA</a></nav>
    <h1>Thư viện hình ảnh</h1>
    <nav aria-label="Mẫu thành phần">
      <a href="../assets/ui-v1/popup-v2-demo.html">Năm mẫu popup</a>
      <a href="../assets/ui-v1/motion-v3-demo.html">Motion Lab</a>
      <a href="asset-inventory.json">Danh mục tệp</a>
    </nav>
  </header>
  <div class="filters">
    <label>Trạng thái <select id="motion"><option value="portrait">Ảnh tĩnh</option><option value="idle">Đứng yên</option><option value="sleepy">Buồn ngủ</option><option value="tap">Phản ứng chạm</option><option value="energy">Nhận năng lượng</option><option value="cheer">Ăn mừng</option></select></label>
    <label>Phụ kiện xem thử <select id="accessory"><option value="">Không trang bị</option></select></label>
  </div>
  <main>
    <section><h2>12 cung · 4 cấp</h2><div id="forms"></div></section>
    <section><h2>16 vật phẩm</h2><div id="props"></div></section>
  </main>
  <script type="module">
    import { spriteDirectory } from '../assets/ui-v1/staging-sprites.js';
    import { presentSprite } from '../assets/ui-v1/accessory-placement.js';

    const signs = ['aries','taurus','gemini','cancer','leo','virgo','libra','scorpio','sagittarius','capricorn','aquarius','pisces'];
    const signNames = ['Bạch Dương','Kim Ngưu','Song Tử','Cự Giải','Sư Tử','Xử Nữ','Thiên Bình','Bọ Cạp','Nhân Mã','Ma Kết','Bảo Bình','Song Ngư'];
    const props = ['bubble_tea','teddy','snack','mirror','lipstick','headphones','bow','beanie','book','coffee','hotpot','camera','flower','sunglasses','scarf','star_lamp'];
    const propNames = ['Trà sữa','Gấu bông','Snack','Gương','Son','Tai nghe','Nơ','Mũ len','Sách','Cà phê','Lẩu','Máy ảnh','Hoa','Kính','Khăn','Đèn sao'];
    const motion = document.querySelector('#motion');
    const accessory = document.querySelector('#accessory');
    const forms = document.querySelector('#forms');
    props.forEach((id,i) => accessory.add(new Option(propNames[i],id)));
    document.querySelector('#props').innerHTML = props.map((prop,i) => `<figure><img class="item mindi-sprite-art" loading="lazy" alt="" src="../assets/props/${prop}.png"><figcaption>${propNames[i]}</figcaption></figure>`).join('');
    function render() {
      const kind = motion.value;
      forms.innerHTML = signs.flatMap((sign,i) => [1,2,3,4].map(level => {
        const dir = 'assets/' + spriteDirectory(sign, level, kind);
        const src = kind === 'portrait' ? `${dir}characters/${sign}_lv${level}.png` : `${dir}animations/${kind}/${sign}_lv${level}.gif`;
        const overlay = accessory.value ? `<img class="accessory mindi-sprite-art" loading="lazy" alt="" src="../assets/props/${accessory.value}.png">` : '';
        return `<figure><div class="sprite"><img class="mindi-sprite-art" src="../${src}" loading="lazy" alt="">${overlay}</div><figcaption>${signNames[i]} · Cấp ${level}</figcaption></figure>`;
      })).join('');
      for (const sprite of forms.querySelectorAll('.sprite')) {
        presentSprite(sprite.firstElementChild, sprite.querySelector('.accessory'), accessory.value);
      }
    }
    motion.addEventListener('change',render);
    accessory.addEventListener('change',render);
    render();
  </script>
</body>
</html>
