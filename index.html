<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MINDI · Mầm Vui Mỗi Ngày</title><style>*{box-sizing:border-box}body{margin:0;background:#eee0f0;color:#58354b;font:16px system-ui;display:grid;place-items:center;min-height:100dvh}main{width:min(100%,440px);min-height:100dvh;background:linear-gradient(#ffe6c6,#f6d9e9 65%,#d4e6b7);padding:20px;display:flex;flex-direction:column;gap:12px;text-align:center}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:5px}select,button{font:inherit;border:2px solid #b68b9c;border-radius:14px;background:#fff8e8;color:#593c50;padding:10px}button{cursor:pointer;font-weight:750}button:disabled{opacity:.55}#stage{flex:1;min-height:280px;display:grid;place-items:center;position:relative;border:3px solid #fff7e9;border-radius:24px;background:radial-gradient(circle at 50% 50%,#fff4d5,#e9d7e8)}#pet{font-size:125px;cursor:pointer;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 10px 3px #9c79875a)}#pet:active{transform:scale(1.12)}@keyframes bob{50%{translate:0 -12px}}#accessory{position:absolute;top:14%;right:22%;font-size:45px}#bubble{padding:14px;border:2px solid #cba1a7;background:#fff8ec;border-radius:20px;font-weight:650}#care{background:#ffd46c;font-size:19px;padding:16px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{background:#fff9e6;border-radius:10px;padding:9px 2px;font-size:12px}.done{background:#c7eab7}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.nav button{font-size:13px}dialog{border:3px solid #b98b9f;border-radius:18px;background:#fff9ec;max-width:min(92vw,400px);color:#593c50}dialog::backdrop{background:#34243d88}.items{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.items button{font-size:28px}.muted{opacity:.35}small{color:#846879}</style><main><header><h1>🌱 MINDI</h1><select id="sign"></select></header><div id="level">Lv.1</div><div id="bubble">Một chạm hôm nay, thêm chút năng lượng ♡</div><div id="stage"><span id="pet" role="button" aria-label="Chạm Mầm">🌱</span><span id="accessory"></span></div><button id="care">🌱 Chăm Mầm hôm nay ♡</button><div class="week" id="week"></div><div class="nav"><button id="wardrobe">🎀 Tủ đồ</button><button id="collection">🎁 Bộ sưu tập</button><button id="progress">📅 Tiến trình</button></div><small>Mỗi ngày một lượt chăm · Reset 00:00 Việt Nam<br>Demo công khai: visual emoji tạm thời, chưa phải bộ nhân vật PNG V8</small></main><dialog id="modal"><button id="close">✕ Đóng</button><div id="content"></div></dialog><script>const signs=['Bạch Dương','Kim Ngưu','Song Tử','Cự Giải','Sư Tử','Xử Nữ','Thiên Bình','Bọ Cạp','Nhân Mã','Ma Kết','Bảo Bình','Song Ngư'];const gifts=['🧋','🧸','🍪','🪞','💄','🎧','🎀','🧢','📚','☕','🌸','🕶️','🧣','💡'];const key='mindi-public-demo-v1';let s;try{s=JSON.parse(localStorage.getItem(key))||{}}catch{s={}}s.sign=Number.isInteger(s.sign)&&s.sign>=0&&s.sign<12?s.sign:0;s.days=Array.isArray(s.days)?s.days:[];s.gifts=Array.isArray(s.gifts)?s.gifts:[];s.weeks=Array.isArray(s.weeks)?s.weeks:[];const $=id=>document.getElementById(id);function date(d=new Date()){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);const a=Object.fromEntries(p.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return a.year+'-'+a.month+'-'+a.day}function lv(){let n=s.days.length;return n>=45?4:n>=21?3:n>=7?2:1}function save(){localStorage.setItem(key,JSON.stringify(s))}function say(t){$('bubble').textContent=t}function pop(t){$('content').innerHTML=t;$('modal').showModal()}function render(){let today=date();$('level').textContent='Lv.'+lv()+' · '+s.days.length+' ngày chăm';$('pet').textContent=['🌱','🪴','🌻','🌳'][lv()-1];$('accessory').textContent=s.equipped||'';$('care').disabled=s.days.includes(today);$('care').textContent=$('care').disabled?'✓ Đã chăm hôm nay · Hẹn mai nhé':'🌱 Chăm Mầm hôm nay ♡';let d=new Date(today+'T12:00:00Z');let n=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-n);$('week').innerHTML=Array.from({length:7},(_,i)=>{let x=new Date(d);x.setUTCDate(d.getUTCDate()+i);let done=s.days.includes(x.toISOString().slice(0,10));return '<div class="day '+(done?'done':'')+'">'+['T2','T3','T4','T5','T6','T7','CN'][i]+'<div>'+(done?'✓':'🌱')+'</div></div>'}).join('')}signs.forEach((n,i)=>{let o=document.createElement('option');o.value=i;o.textContent=n;$('sign').append(o)});$('sign').value=s.sign;$('sign').onchange=e=>{s.sign=Number(e.target.value);save();say('Mình sẽ đồng hành cùng bạn!')};$('pet').onclick=()=>{let h=Number(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Ho_Chi_Minh',hour:'numeric',hourCycle:'h23'}).format(new Date()));say(h<12?'Hôm nay chỉ cần bắt đầu bằng một việc nhỏ!':h<18?'Nghỉ một chút rồi mình cùng cố gắng nhé!':'Hôm nay bạn đã làm tốt rồi, nghỉ ngơi nha!')};$('care').onclick=()=>{let today=date();if(s.days.includes(today))return;s.days.push(today);let d=new Date(today+'T12:00:00Z');let wd=d.getUTCDay();d.setUTCDate(d.getUTCDate()-(wd+6)%7);let wk=d.toISOString().slice(0,10);let reward=null;if((wd===0||wd===6)&&!s.weeks.includes(wk)){s.weeks.push(wk);reward=gifts.find(g=>!s.gifts.includes(g));if(reward)s.gifts.push(reward)}save();render();say('Mình nhận được năng lượng rồi! ♡');pop(reward?'<h2>🎁 Quà cuối tuần!</h2><p style="font-size:70px">'+reward+'</p><p>Phụ kiện mới đã vào tủ đồ.</p>':'<h2>🌱 Mầm vui lên rồi!</h2><p>Hẹn gặp bạn ngày mai nhé ♡</p>')};$('wardrobe').onclick=()=>pop('<h2>🎀 Tủ đồ</h2><div class="items">'+gifts.map(g=>'<button '+(!s.gifts.includes(g)?'disabled class="muted"':'')+' data-gift="'+g+'">'+g+'</button>').join('')+'</div><p>Nhận phụ kiện bằng cách chăm Mầm vào cuối tuần.</p>');$('collection').onclick=()=>pop('<h2>🎁 Bộ sưu tập</h2><p>'+gifts.map(g=>s.gifts.includes(g)?g:'▫️').join(' ')+'</p><p>Đã mở '+s.gifts.length+'/'+gifts.length+' món.</p>');$('progress').onclick=()=>pop('<h2>📅 Tiến trình</h2><p>'+s.days.length+' ngày chăm · Lv.'+lv()+'</p><p>Mốc tiến hóa: 1, 7, 21, 45 ngày.</p><p>Dữ liệu chỉ lưu trên thiết bị đang chơi.</p>');$('close').onclick=()=>$('modal').close();$('content').onclick=e=>{let b=e.target.closest('[data-gift]');if(b&&!b.disabled){s.equipped=b.dataset.gift;save();render();$('modal').close()}};render();setInterval(render,30000);</script></html>
